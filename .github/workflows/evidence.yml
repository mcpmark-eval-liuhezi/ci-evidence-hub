name: CI Evidence

on:
  workflow_dispatch:

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Produce evidence bundle
        run: |
          echo "CI evidence collected on $(date -u +%Y-%m-%dT%H:%M:%SZ)" > evidence-bundle.txt
          echo "run_id=${{ github.run_id }}" >> evidence-bundle.txt
          echo "repository=${{ github.repository }}" >> evidence-bundle.txt
      - name: Upload evidence artifact
        uses: actions/upload-artifact@v4
        with:
          name: evidence-bundle
          path: evidence-bundle.txt
          retention-days: 7

  verify:
    needs: collect
    runs-on: ubuntu-latest
    steps:
      - name: Verify evidence collection
        run: echo "Verification step: collect job completed successfully."
